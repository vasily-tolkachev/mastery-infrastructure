name: Deploy

on:
  workflow_dispatch:
    inputs:
      reset_postgres_data:
        description: "Reset Postgres volume before deploy (data loss)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug secrets and variables
        run: |
          echo "=== Variables ==="
          echo "CORE_IMAGE:      '${{ vars.CORE_IMAGE }}'"
          echo "AUTH_IMAGE:      '${{ vars.AUTH_IMAGE }}'"
          echo "FRONTEND_IMAGE:  '${{ vars.FRONTEND_IMAGE }}'"

          echo
          echo "=== Secrets ==="
          echo "DEPLOY_HOST set: ${{ secrets.DEPLOY_HOST != '' }}"
          echo "DEPLOY_USER set: ${{ secrets.DEPLOY_USER != '' }}"
          echo "DEPLOY_SSH_KEY set: ${{ secrets.DEPLOY_SSH_KEY != '' }}"
          echo "DEPLOY_PATH set: ${{ secrets.DEPLOY_PATH != '' }}"
          echo "GHCR_USER set: ${{ secrets.GHCR_USER != '' }}"
          echo "GHCR_TOKEN set: ${{ secrets.GHCR_TOKEN != '' }}"
          echo "POSTGRES_DB set: ${{ secrets.POSTGRES_DB != '' }}"
          echo "POSTGRES_USER set: ${{ secrets.POSTGRES_USER != '' }}"
          echo "POSTGRES_PASSWORD set: ${{ secrets.POSTGRES_PASSWORD != '' }}"
          echo "AUTH_JWT_KEY_ID set: ${{ secrets.AUTH_JWT_KEY_ID != '' }}"
          echo "AUTH_PROVIDERS_GOOGLE_CLIENT_ID set: ${{ secrets.AUTH_PROVIDERS_GOOGLE_CLIENT_ID != '' }}"
          echo "AUTH_JWKS_URI set: ${{ secrets.AUTH_JWKS_URI != '' }}"
          echo "OPENAI_API_KEY set: ${{ secrets.OPENAI_API_KEY != '' }}"

      - name: Check local deployment files
        run: |
          ls -la
          echo
          echo "Compose files:"
          find . -name "docker-compose*"

          echo
          echo "Nginx files:"
          ls -la nginx || true

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            mkdir -p "${{ secrets.DEPLOY_PATH }}"

            echo "Before cleanup:"
            ls -la "${{ secrets.DEPLOY_PATH }}" || true

            rm -rf "${{ secrets.DEPLOY_PATH }}/nginx"

            mkdir -p "${{ secrets.DEPLOY_PATH }}/nginx"

            echo "After cleanup:"
            ls -la "${{ secrets.DEPLOY_PATH }}"

      - name: Upload deployment files
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          scp -o StrictHostKeyChecking=no \
            -r \
            docker-compose.yml \
            docker-compose.images.yml \
            nginx \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Verify server files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            echo "=== Deployment directory ==="
            ls -la "${{ secrets.DEPLOY_PATH }}"

            echo
            echo "=== nginx directory ==="
            ls -la "${{ secrets.DEPLOY_PATH }}/nginx"

            test -f "${{ secrets.DEPLOY_PATH }}/nginx/nginx.local.conf"

            echo "nginx.local.conf is a file ✅"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          CORE_IMAGE: ${{ vars.CORE_IMAGE }}
          AUTH_IMAGE: ${{ vars.AUTH_IMAGE }}
          FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_JWT_KEY_ID: ${{ secrets.AUTH_JWT_KEY_ID }}
          AUTH_PROVIDERS_GOOGLE_CLIENT_ID: ${{ secrets.AUTH_PROVIDERS_GOOGLE_CLIENT_ID }}
          AUTH_JWKS_URI: ${{ secrets.AUTH_JWKS_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RESET_POSTGRES_DATA: ${{ inputs.reset_postgres_data }}

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          envs: CORE_IMAGE,AUTH_IMAGE,FRONTEND_IMAGE,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,AUTH_JWT_KEY_ID,AUTH_PROVIDERS_GOOGLE_CLIENT_ID,AUTH_JWKS_URI,OPENAI_API_KEY,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH,RESET_POSTGRES_DATA

          script: |
            set -e

            cd "$DEPLOY_PATH"

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USER" \
              --password-stdin

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.images.yml \
              pull

            if [ "$RESET_POSTGRES_DATA" = "true" ]; then
              docker compose \
                -f docker-compose.yml \
                -f docker-compose.images.yml \
                down -v --remove-orphans
            fi

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.images.yml \
              up -d --no-build