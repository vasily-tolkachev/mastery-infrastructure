name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug secrets and variables
        run: |
          echo "=== Variables ==="
          echo "CORE_IMAGE:      '${{ vars.CORE_IMAGE }}'"
          echo "AUTH_IMAGE:      '${{ vars.AUTH_IMAGE }}'"
          echo "FRONTEND_IMAGE:  '${{ vars.FRONTEND_IMAGE }}'"

          echo
          echo "=== Secrets ==="
          echo "DEPLOY_HOST set: ${{ secrets.DEPLOY_HOST != '' }}"
          echo "DEPLOY_USER set: ${{ secrets.DEPLOY_USER != '' }}"
          echo "DEPLOY_USER set: ${{ secrets.DEPLOY_USER != '' }}"
          echo "DEPLOY_SSH_KEY set: ${{ secrets.DEPLOY_SSH_KEY != '' }}"
          echo "DEPLOY_PATH set: ${{ secrets.DEPLOY_PATH != '' }}"
          echo "GHCR_USER set: ${{ secrets.GHCR_USER != '' }}"
          echo "GHCR_TOKEN set: ${{ secrets.GHCR_TOKEN != '' }}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: FRONTEND_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.images.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.images.yml up -d --no-build