services:
  postgres:
    image: postgres:17-alpine
    container_name: mastery-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mastery}
      POSTGRES_USER: ${POSTGRES_USER:-mastery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mastery}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - mastery-net

  auth:
    image: ${AUTH_IMAGE:-ghcr.io/mastery/mastery-auth:latest}
    pull_policy: always
    container_name: mastery-auth
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mastery}
      DB_USERNAME: ${POSTGRES_USER:-mastery}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mastery}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID}
      AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS: 3600
      AUTH_PROVIDERS_GOOGLE_ENABLED: "true"
      AUTH_PROVIDERS_GOOGLE_CLIENT_ID: ${AUTH_PROVIDERS_GOOGLE_CLIENT_ID}
    networks:
      - mastery-net

  core:
    image: ${CORE_IMAGE:-ghcr.io/mastery/mastery-core:latest}
    pull_policy: always
    container_name: mastery-core
    restart: unless-stopped
    depends_on:
      - postgres
      - auth
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mastery}
      DB_USERNAME: ${POSTGRES_USER:-mastery}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mastery}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID}
      TELEGRAM_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    networks:
      - mastery-net

  quest:
    image: ${QUEST_IMAGE:-ghcr.io/mastery/mastery-quest:latest}
    pull_policy: always
    container_name: mastery-quest
    restart: unless-stopped
    depends_on:
      - postgres
      - auth
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mastery}
      DB_USERNAME: ${POSTGRES_USER:-mastery}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mastery}
      QUEST_DB_SCHEMA: ${QUEST_DB_SCHEMA:-quest}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_CONNECT_TIMEOUT_MS: ${OPENAI_CONNECT_TIMEOUT_MS:-10000}
      OPENAI_READ_TIMEOUT_MS: ${OPENAI_READ_TIMEOUT_MS:-60000}
    networks:
      - mastery-net

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/mastery/mastery-frontend:latest}
    pull_policy: always
    container_name: mastery-frontend
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
      PUBLIC_AUTH_BASE_URL: ${PUBLIC_AUTH_BASE_URL:-/api/auth}
      GOOGLE_CLIENT_ID: ${AUTH_PROVIDERS_GOOGLE_CLIENT_ID}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${AUTH_PROVIDERS_GOOGLE_CLIENT_ID}
      VITE_GOOGLE_CLIENT_ID: ${AUTH_PROVIDERS_GOOGLE_CLIENT_ID}
    networks:
      - mastery-net

  nginx:
    image: nginx:1.27-alpine
    container_name: mastery-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - core
      - auth
      - quest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mastery-net

volumes:
  postgres_data:

networks:
  mastery-net:

