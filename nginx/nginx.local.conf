events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    upstream core_upstream {
        server core:8080;
    }

    upstream auth_upstream {
        server auth:8081;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream quest_upstream {
        server quest:8082;
    }

    server {
        listen 80;
        server_name _;

        location /api/auth/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://core_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/quests/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://quest_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/quests {
            return 301 /api/quests/;
        }

        location /auth/swagger-ui/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://auth_upstream/swagger-ui/;
            proxy_redirect ~^/(.*)$ /auth/$1;
            proxy_set_header X-Forwarded-Prefix /auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /auth/swagger-ui {
            return 301 /auth/swagger-ui/;
        }

        location /auth/api-docs {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://auth_upstream/api-docs;
            proxy_redirect ~^/(.*)$ /auth/$1;
            proxy_set_header X-Forwarded-Prefix /auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /core/swagger-ui/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://core_upstream/swagger-ui/;
            proxy_redirect ~^/(.*)$ /core/$1;
            proxy_set_header X-Forwarded-Prefix /core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /core/swagger-ui {
            return 301 /core/swagger-ui/;
        }

        location /core/api-docs {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://core_upstream/api-docs;
            proxy_redirect ~^/(.*)$ /core/$1;
            proxy_set_header X-Forwarded-Prefix /core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /quest/swagger-ui/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://quest_upstream/swagger-ui/;
            proxy_redirect ~^/(.*)$ /quest/$1;
            proxy_set_header X-Forwarded-Prefix /quest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /quest/swagger-ui {
            return 301 /quest/swagger-ui/;
        }

        location /quest/api-docs {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://quest_upstream/api-docs;
            proxy_redirect ~^/(.*)$ /quest/$1;
            proxy_set_header X-Forwarded-Prefix /quest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
